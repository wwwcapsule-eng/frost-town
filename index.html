<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#cfe3f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>寒霜小鎮</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#cfe3f2;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
  canvas{display:block}
  #hud{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
  .pill{background:rgba(30,40,60,.72);color:#fff;border-radius:16px;padding:4px 12px 4px 8px;font-weight:700;font-size:18px;
    display:flex;align-items:center;gap:6px;min-width:76px}
  .pill b{font-size:20px}
  @media (max-width:500px){.pill{font-size:15px;padding:3px 9px 3px 6px;min-width:0}.pill b{font-size:17px}.cap{font-size:11px}}
  .pill.bump{animation:bump .25s}
  .cap{font-size:13px;opacity:.75}
  .pill.full{background:rgba(200,120,20,.85)}
  .pill.danger{background:rgba(200,40,40,.85);animation:blink .8s infinite}
  #bars{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(150px, calc(100vw - 250px));display:flex;flex-direction:column;gap:5px;pointer-events:none}
  .bar{position:relative;height:20px;border-radius:10px;background:rgba(30,40,60,.72);overflow:hidden;color:#fff;font-weight:900;font-size:13px}
  .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:10px;transition:width .2s}
  .bar span{position:relative;display:block;text-align:center;line-height:20px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
  #hpBar i{background:#e8474f}#fuelBar i{background:#ff9a2e}
  .bar.danger{animation:blink .8s infinite}
  #goal{position:fixed;top:calc(62px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(240px, calc(100vw - 210px));box-sizing:border-box;
    background:rgba(255,255,255,.88);color:#25415e;font-weight:900;font-size:13px;line-height:1.35;padding:5px 10px;border-radius:12px;
    text-align:center;pointer-events:none;box-shadow:0 2px 0 rgba(0,0,0,.12)}
  #goal.done{background:#ffd34d;animation:bump .4s}
  #alert{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:rgba(200,40,40,.88);color:#fff;
    font-weight:900;font-size:16px;padding:6px 14px;border-radius:14px;white-space:nowrap;pointer-events:none;display:none}
  #alert.cold{background:rgba(40,120,200,.88)}
  #alert.warn{background:rgba(220,140,20,.9)}
  #frost{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 110px 40px rgba(150,210,255,.7);background:rgba(170,215,255,.12);opacity:0;transition:opacity 1s}
  #vignette{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 80px 20px rgba(220,30,30,.55);opacity:0;transition:opacity .4s}
  @keyframes bump{50%{transform:scale(1.15)}}
  #title{position:fixed;top:calc(10px + env(safe-area-inset-top));left:12px;color:#25415e;font-weight:900;font-size:20px;
    text-shadow:0 2px 0 #fff;pointer-events:none}
  #title small{display:block;font-size:12px;font-weight:700;opacity:.7}
  #reset{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));font-size:12px;border:0;border-radius:10px;
    padding:6px 10px;background:rgba(30,40,60,.45);color:#fff}
  #saveCode{position:fixed;left:180px;bottom:calc(12px + env(safe-area-inset-bottom));font-size:12px;border:0;border-radius:10px;
    padding:6px 10px;background:rgba(30,40,60,.45);color:#fff}
  #mute{position:fixed;left:96px;bottom:calc(12px + env(safe-area-inset-bottom));font-size:12px;border:0;border-radius:10px;
    padding:6px 10px;background:rgba(30,40,60,.45);color:#fff}
  #planBtn{position:fixed;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));font-size:18px;font-weight:900;border:0;border-radius:14px;
    padding:12px 16px;background:#ffd34d;color:#333;box-shadow:0 3px 0 rgba(0,0,0,.25);display:none;z-index:5}
  #planBar{position:fixed;left:0;right:0;bottom:0;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:rgba(30,40,60,.88);
    color:#fff;font-weight:700;display:none;z-index:6;text-align:center}
  #planTip{font-size:14px;margin-bottom:8px;min-height:20px}
  #planBar .row{display:flex;gap:8px;justify-content:center;margin-top:8px}
  #planBar button{flex:1;max-width:120px;min-height:58px;border:0;border-radius:12px;font-size:15px;font-weight:900;background:#e8eef5;color:#333;padding:4px 2px;white-space:nowrap}
  #planBar button small{font-size:12px;font-weight:700}
  #planBar button.sel{background:#ffd34d;outline:3px solid #fff}
  #planBar #planGo{background:#5fd068}#planBar #planGo:disabled{opacity:.4}
  #toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:rgba(30,40,60,.8);color:#fff;font-weight:700;
    padding:8px 16px;border-radius:14px;font-size:16px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
  #hint{position:fixed;left:50%;bottom:9%;transform:translateX(-50%);color:#25415e;font-weight:900;font-size:18px;
    text-shadow:0 2px 0 #fff;pointer-events:none;text-align:center;animation:blink 1.4s infinite}
  @keyframes blink{50%{opacity:.35}}
  #joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.25);
    border:3px solid rgba(255,255,255,.6);display:none;pointer-events:none}
  #knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.85)}
  #menu .box button{display:block;width:100%;margin-top:10px;font-size:17px;padding:10px 16px}
  #menu .box button small{display:block;font-size:12px;font-weight:700;color:#666}
  #menu .box button.cur{outline:3px solid #25415e}
  #lose,#lvup,#menu{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,30,50,.7);z-index:20}
  .box{background:#fff;border-radius:18px;padding:24px 28px;text-align:center;font-weight:700;color:#333;max-width:80vw;line-height:1.7}
  .box .big{font-size:28px;font-weight:900;margin-bottom:6px}
  .box button{margin-top:16px;font-size:20px;font-weight:900;border:0;border-radius:12px;padding:12px 28px;background:#ffd34d;color:#333}
</style>
</head>
<body>
<div id="title">寒霜小鎮<small id="ver"></small></div>
<div id="hud">
  <div class="pill" id="pPop">👥 <b id="pop">0</b><span class="cap" id="capP"></span></div>
  <div class="pill" id="pCash">💵 <b id="cash">0</b></div>
  <div class="pill" id="pMeat">🍖 <b id="meat">0</b><span class="cap" id="capM"></span></div>
  <div class="pill" id="pCoal" style="display:none">⚫ <b id="coal">0</b><span class="cap" id="capC"></span></div>
  <div class="pill" id="pWood">🪵 <b id="wood">0</b><span class="cap" id="capW"></span></div>
</div>
<div id="bars">
  <div class="bar" id="hpBar"><i></i><span>❤️ <b id="hp">100</b></span></div>
  <div class="bar" id="fuelBar"><i></i><span>🔥 <em id="fireName" style="font-style:normal">營火</em> <b id="fuel">100</b>%</span></div>
</div>
<div id="goal"></div>
<div id="alert"></div>
<div id="vignette"></div>
<div id="frost"></div>
<div id="toast"></div>
<div id="hint"></div>
<div id="joy"><div id="knob"></div></div>
<button id="reset">☰ 選單</button>
<button id="saveCode">💾 存檔</button>
<button id="planBtn">🏗️ 規劃</button>
<div id="planBar"><div id="planTip"></div><div class="row">
  <button data-k="house">🏠 民房<br><small id="pkHouse"></small></button>
  <button data-k="heater">🔥 暖氣塔<br><small id="pkHeater"></small></button>
  <button data-k="mill" class="pro">🪚 鋸木機<br><small id="pkMill"></small></button>
  <button data-k="grill" class="pro">🍖 烤肉攤<br><small id="pkGrill"></small></button>
</div><div class="row">
  <button id="planGo" disabled>✅ 蓋這裡</button>
  <button id="planExit">✖ 離開</button>
</div></div>
<div id="menu"><div class="box"><div class="big">選擇關卡</div>
  <button data-mode="tutorial">📘 教學關<small>建築位置固定，跟著上方目標一步步蓋</small></button>
  <button data-mode="build">🏗️ 正式關・自己蓋<small>用規劃模式自己選位置，民房、加工建築各有自己的區</small></button>
  <button data-mode="auto">🤖 正式關・電腦託管<small>你只決定蓋什麼，電腦幫你挑位置</small></button>
  <button id="menuReset" style="background:#eee">🔄 這一關重新開始</button>
  <button id="menuClose" style="background:#eee">✖ 關閉</button>
</div></div>
<div id="lose"><div class="box"><div class="big">🐻 營地失守了</div><div>所有建築都被熊拆掉了</div><button id="retry">重新開始</button></div></div>
<div id="lvup"><div class="box"><div class="big" id="lvTitle"></div><div id="lvList"></div><button id="lvOk">太好了！</button></div></div>
<button id="mute"></button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const VERSION = '0.46';

// ===== 數值（之後平衡都改這裡） =====
const CFG = {
  speed: 6,                 // 主角移動速度
  chopRange: 1.9,           // 自動砍樹距離
  chopInterval: [0.45, 0.32, 0.22, 0.15], // 斧頭各等級的出手間隔（秒）
  treeHp: 3,
  logsPerTree: 3,
  treeRegrow: 12,           // 樹重新長出來的秒數
  capacity: [10, 20, 30, 45], // 背包各等級容量
  millTime: 0.6,            // 鋸木機每根木頭加工秒數
  logValue: 1,              // 一根木頭換幾元
  meatValue: 3,             // 一塊肉換幾元
  bearHp: 5, bearCount: 5, bearRespawn: 20, meatPerBear: 2,
  towerRange: 11, towerInterval: 1.1, // 弩砲塔射程與射速
  buildCool: 2,             // 升級完要等幾秒才能再升級
  coldBase: 0.6, coldPerUnit: 0.25, coldMax: 4, // 野外寒冷：出了暖氣圈每秒掉 0.6 血，每遠 1 格多掉 0.25，最多每秒 4（寒潮時 ×1.5）
  playerHp: 100, bearHitDps: 14, bearChase: 6, heal: 20, // 主角血量、熊每秒打人多少、熊幾格內會追人、在營地裡每秒回血
  buildHp: 100, bearBuildDps: 2.5, // 建築血量、熊每秒對建築的傷害
  gateHp: 100, raidEvery: 60, raidFirst: 90, raidBears: 2, bearDps: 1.5, // 北門血量、熊群幾秒來一次、一次幾隻、每隻每秒傷害
  workerSpeed: 3.6, workerChop: 0.6, workerLoad: 6, // 伐木工：速度約主角 60%、出手間隔、一次揹幾根
  payRate: 1.1, padDelay: 0.6, // padDelay：站在付款格上幾秒後才開始付錢             // 付款格：幾秒內付完整筆
  popBase: 2,               // 一開始的人口（主角和夥伴），每個伐木工 +1
  housePop: 5, housePrice: [25, 15], // 每間民房住幾人；民房價錢：第一間 25，之後每間多 15
  fuelMax: 100, fuelBurn: 0.4, fuelPerLog: 5, heat: [10, 17], // 火爐：柴滿 100、每秒燒 0.4、一根木頭 +5；暖氣圈半徑（最小、最大）
  stovePrice: [250, 400, 600], stoveBurn: 0.8, stoveHeat: 2, // 石爐 Lv4～6（領地 Lv3＋煤礦後）：價錢、每級燒柴變成幾成、每級暖氣圈 +2
  terrPrice: [60, 150], terrNeedBuys: 3, // 營火升級（擴大領地）：Lv1 60 元（升級任意 3 個項目後出現）、Lv2 150 元（村莊＋開拓東邊後）
  minePrice: 100, coalHp: 4, coalPerRock: 2, coalRegrow: 20, fuelPerCoal: 20, // 煤礦（村莊解鎖）：價錢、敲幾下、掉幾塊、幾秒長回來；一塊煤 = 火爐 +20（木頭只有 +5）
  snowEvery: 7, snowMax: 10, snowHp: 3, snowSlow: 0.45, shovelPrice: 60, // 雪堆（村莊開始）：幾秒積一堆、最多幾堆、鏟幾下、踩到剩幾成速度、鏟雪工價錢
  heaterPrice: 120, heaterR: 7, cell: 3, mill2Price: 80, grill2Price: 150, // 規劃模式：暖氣塔價錢、暖氣範圍半徑、格子大小；正式關：第二台鋸木機、第二座烤肉攤價錢
  coldFirst: 120, coldEvery: 150, coldLen: 30, coldBurn: 3, coldShrink: 0.75, coldReward: 30, // 寒潮（村莊開始）：第一次幾秒後、之後每幾秒、持續幾秒、火爐燒幾倍快、暖氣圈縮成幾成、撐過去的獎金 // 火爐升級（村莊解鎖）：暖氣圈最大半徑 +7
};
// 城市等級：人口到門檻就升級（藍圖見 docs/企劃評估.md 第 8 節）；houses＝這一級最多能蓋幾間民房
// cam＝鏡頭拉遠倍數；unlock＝升級卡片上列的新東西
const LEVELS = [
  { name: '營地', icon: '🏕️', need: 0, houses: 4, heaters: 0, cam: 1 },
  { name: '村莊', icon: '🏘️', need: 20, houses: 20, heaters: 1, cam: 1.25, unlock: ['🏠 民房上限 4 → 20 間', '🔥 營火升級 Lv2：領地再擴大（要先開拓東邊）', '🏗️ 規劃模式：民房、暖氣塔自己決定蓋在哪', '⛏️ 煤礦、🧹 鏟雪工、❄️ 寒潮'] },
  { name: '小鎮', icon: '🏙️', need: 80, houses: 40, heaters: 4, cam: 1.45, unlock: ['🏠 民房上限 20 → 40 間', '🔥 暖氣塔最多 4 座'] },
  { name: '城市', icon: '🌆', need: 300, houses: 40, heaters: 4, cam: 1.6, unlock: ['🚧 城市的新玩法製作中，敬請期待'] },
];

// 領地等級：營火升級一次，圍欄往外推（r＝圍欄半徑）、暖氣圈變大（heat）、鏡頭拉遠一點（cam）
const TERR = [ { r: 10, heat: 0, cam: 1.05 }, { r: 14, heat: 3, cam: 1.15 }, { r: 18.5, heat: 7, cam: 1.28 } ];
// 地塊配置（作者 10/17 第二次回饋：每個建築、付款格都有自己的位置，不互擋）
// 營火廣場在 (0,-3)；N-S 主路 x≈0；東路 z≈0；民房在南邊一圈圈的地塊上，門朝營火
const LOT = {
  bag: [-2.8, -5.6], axe: [2.8, -5.6], terr: [-3.2, 1.6], worker: [3.2, 1.6], shovel: [5.4, 4.2], tower1: [3.6, -7.4], tower2: [-3.6, -7.4],
  mill: [6.4, -4], mill2: [-6.4, -4], bbq: [-4.6, 3.8], minePad: [-8, 3],
};
const HOUSE_LOTS = [];                    // 第 1 圈 6 間（Lv1 領地），第 2 圈 10 間（Lv2 領地）
[[11.6, [35, 50, 65, 115, 130, 145], 1], [16.2, [30, 41, 52, 63, 74, 106, 117, 128, 139, 150], 2]].forEach(([r, angs, ring]) =>
  angs.forEach(a => HOUSE_LOTS.push({ x: +(Math.cos(a * Math.PI / 180) * r).toFixed(2), z: +(Math.sin(a * Math.PI / 180) * r).toFixed(2), ring })));
const ROCK_LOTS = [[-11.2, -0.6], [-10.2, 2.2], [-11.6, -3.4], [-9.9, -6.2], [-12, 1]]; // 煤礦區（西邊，第 1 次擴大領地後圈進來）

// ===== 存檔 =====
// 關卡（企劃 9.2）：教學關沿用原本的存檔；正式關（自己蓋／電腦託管）各有自己的存檔
const MODE_KEY = 'frost-town-mode';
let MODE = null; try { MODE = localStorage.getItem(MODE_KEY); } catch (e) {}
const firstRun = !MODE;
if (!['tutorial', 'build', 'auto'].includes(MODE)) MODE = 'tutorial';
const PRO = MODE !== 'tutorial';
const SAVE_KEY = 'frost-town-save-v1' + (PRO ? '-' + MODE : '');
let save = { cash: 0, bag: 0, axe: 0, east: false, mill2: false, tower: false, workers: 0, level: 0, houses: 0, stove: 0 };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); } catch (e) {}
if (save.territory == null) save.territory = save.furnace ? (save.east ? 2 : 1) : 0;          // 舊進度：火爐升級過就當作領地擴大過
if (save.buys == null) save.buys = (save.bag || 0) + (save.axe || 0) + (save.tower ? 1 : 0) + (save.tower2 ? 1 : 0) + (save.workers || 0) + (save.east ? 1 : 0) + (save.mill2 ? 1 : 0);
let resetting = false; // 重新開始時不要再把舊進度寫回去
function writeSave() { if (resetting) return; try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
function wipeAndReload() { resetting = true; try { localStorage.removeItem(SAVE_KEY); } catch (e) {} location.reload(); }
document.getElementById('retry').onclick = wipeAndReload;
// 存檔碼（企劃 9.4）：手機瀏覽器可能清掉存檔，玩家可以把進度抄成一段文字、換手機或清掉後貼回來
document.getElementById('saveCode').onclick = () => {
  writeSave();
  const code = btoa(unescape(encodeURIComponent(JSON.stringify(save))));
  try { navigator.clipboard.writeText(code).catch(() => {}); } catch (e) {} // 不能複製也沒關係，畫面上看得到
  const got = prompt('這是你的存檔碼（已試著複製），請存在記事本。\n要讀取別的進度：把存檔碼貼在下面、按確定。', code);
  if (!got || got.trim() === code) return;
  let data;
  try { data = JSON.parse(decodeURIComponent(escape(atob(got.trim())))); } catch (e) {}
  if (!data || typeof data !== 'object' || Array.isArray(data) || typeof data.cash !== 'number') { alert('存檔碼看不懂，請確認有完整貼上。'); return; }
  resetting = true; try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch (e) {} location.reload();
};
document.getElementById('menuReset').onclick = () => {
  if (confirm('確定要清除這一關的進度、重新開始嗎？')) { resetting = true; try { localStorage.removeItem(SAVE_KEY); } catch (e) {} location.reload(); }
};

// ===== 場景 =====
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfe3f2);
scene.fog = new THREE.Fog(0xcfe3f2, 45, 90);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);

const hemi = new THREE.HemisphereLight(0xffffff, 0x9fb8d0, 0.75); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 0.75);
sun.position.set(-10, 20, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -18, right: 18, top: 18, bottom: -18, near: 1, far: 60 });
scene.add(sun, sun.target);

const M = c => new THREE.MeshLambertMaterial({ color: c });
const mats = {
  snow: M(0xf4f8fc), dirt: M(0xc98c5a), trunk: M(0x7a4a2a), leaf: M(0x3f7f9a), leafSnow: M(0xe8f2fa),
  log: M(0xb06a35), meat: M(0xd9414a), fur: M(0xf2f0ea), cash: M(0x3fbf5a), wood: M(0x8a5a35), roof: M(0xb53a2e), player: M(0x2f8fd8),
  skin: M(0xffd6b0), ice: new THREE.MeshLambertMaterial({ color: 0xd6ecff, transparent: true, opacity: 0.85 }),
  axe: M(0xdfe6ee), coal: M(0x2a2c33), rock: M(0x6b7280),
};
function box(w, h, d, mat) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.castShadow = m.receiveShadow = true; return m; }

// 自動道路（作者 10/17 回饋第 4 項）：主路＋民房環狀路，每棟建築從門口鋪一段路接到最近的路；有變動就整組重鋪
const roads = new THREE.Group(); scene.add(roads);
const roadMat = new THREE.MeshLambertMaterial({ color: 0x8d939b, polygonOffset: true, polygonOffsetFactor: -1 });
const roadGeo = new THREE.PlaneGeometry(1, 1), plazaGeo = new THREE.CircleGeometry(2.6, 24);
let roadsDirty = true;
function roadSeg(ax, az, bx, bz, w = 1.3) {
  const len = Math.hypot(bx - ax, bz - az); if (len < 0.05) return;
  const m = new THREE.Mesh(roadGeo, roadMat);
  m.scale.set(w, len + w * 0.5, 1); m.rotation.set(-Math.PI / 2, 0, Math.atan2(bx - ax, bz - az), 'YXZ'); // 先在平面上轉向，再放平
  m.position.set((ax + bx) / 2, 0.02, (az + bz) / 2); m.receiveShadow = true; roads.add(m);
}
function nearestOnSeg(x, z, [ax, az, bx, bz]) {
  const dx = bx - ax, dz = bz - az, t = Math.max(0, Math.min(1, ((x - ax) * dx + (z - az) * dz) / (dx * dx + dz * dz)));
  return [ax + dx * t, az + dz * t];
}
function rebuildRoads() {
  roadsDirty = false;
  roads.children.slice().forEach(m => roads.remove(m));
  const main = [[0, -FENCE_R - 1.5, 0, FENCE_R + 0.5]];               // 南北主路：北門 → 營火 → 南門
  if (save.east) main.push([0, 0, FENCE_R + 0.5, 0]);                 // 東路
  [[1, 9.8], [2, 14.3]].forEach(([ring, r]) => {                      // 民房環狀路：只鋪有民房的那段弧，並接到主路（90°）
    const angs = HOUSE_LOTS.slice(0, save.houses).filter(l => l.ring === ring).map(l => Math.atan2(l.z, l.x) * 180 / Math.PI);
    if (!angs.length) return;
    const a0 = Math.min(90, ...angs), a1 = Math.max(90, ...angs);
    for (let a = a0; a < a1; a += 10) {
      const b = Math.min(a + 10, a1) * Math.PI / 180, c = a * Math.PI / 180;
      main.push([Math.cos(c) * r, Math.sin(c) * r, Math.cos(b) * r, Math.sin(b) * r]);
    }
  });
  main.forEach(s => roadSeg(...s));
  const plaza = new THREE.Mesh(plazaGeo, roadMat); plaza.rotation.x = -Math.PI / 2; plaza.position.set(0, 0.02, -3); roads.add(plaza); // 營火廣場
  for (const b of buildings) {                                        // 每棟建築接一段路到最近的主路／環狀路
    let best = null, bd = Infinity;
    for (const s of main) { const p = nearestOnSeg(b.x, b.z, s), d = Math.hypot(p[0] - b.x, p[1] - b.z); if (d < bd) { bd = d; best = p; } }
    if (best && bd > b.r) roadSeg(b.x, b.z, best[0], best[1], 1.1);
  }
}

// 文字標籤（價格、名稱）
function makeLabel(w = 256, h = 128) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const tex = new THREE.CanvasTexture(cv);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false }));
  sp.renderOrder = 10;
  let last = '';
  sp.set = (lines, color = '#fff', sizes = [44, 30]) => { // sizes：每一行的字級
    const key = lines.join('|') + color + sizes; if (key === last) return; last = key; // 文字沒變就不重畫
    const g = cv.getContext('2d'); g.clearRect(0, 0, w, h);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    const fs = lines.map((t, i) => sizes[Math.min(i, sizes.length - 1)]);
    let y = h / 2 - fs.reduce((a, b) => a + b * 1.05, 0) / 2;
    lines.forEach((t, i) => {
      g.font = (i === 0 ? '900 ' : '800 ') + fs[i] + 'px "Noto Sans TC","Microsoft JhengHei",sans-serif';
      g.lineWidth = Math.max(8, fs[i] / 6); g.strokeStyle = 'rgba(30,40,60,.85)';
      y += fs[i] * 0.525;
      g.strokeText(t, w / 2, y); g.fillStyle = color; g.fillText(t, w / 2, y);
      y += fs[i] * 0.525;
    });
    tex.needsUpdate = true;
  };
  return sp;
}

// 地上的虛線方框（投放點、付款格）；icon 是畫在格子裡的圖示（emoji）
function makePad(x, z, size, color, icon) {
  const g = new THREE.Group();

    d.rotation.x = -Math.PI / 2;

    const e = size / 2;
    if (s === 0) d.position.set(t, 0, -e); if (s === 1) d.position.set(t, 0, e);
    if (s === 2) { d.position.set(-e, 0, t); d.rotation.z = Math.PI / 2; }

    ic.rotation.x = -Math.PI / 2; ic.position.y = 0.004; g.add(ic);

// ===== 營地圍欄：走不過去，只能從三個門進出；門有人靠近會自己打開 =====
let FENCE_R = 8.7;                  // 圍欄半徑：營火升級（擴大領地）時變大
const GATES = [                      // w＝門寬（固定），half＝門在圓上佔的角度一半（跟著半徑重算）
  { a: Math.PI * 1.5, w: 8.3, half: 0.5 },  // 北門（熊會來撞）
  { a: Math.PI / 2, w: 5.1, half: 0.3 },    // 南門（村民進出）
  { a: 0, w: 7.6, half: 0.45 },             // 東門

function angDiff(a, b) { let d = (a - b) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return Math.abs(d); }
function inGate(x, z) { const a = Math.atan2(z, x); return GATES.some(g => angDiff(a, g.a) < g.half - 0.05); }
function gatePoint(g, r) { return [Math.cos(g.a) * r, Math.sin(g.a) * r]; }
const fencePosts = new THREE.Group(); scene.add(fencePosts);
function buildFence() {
  fencePosts.clear();
  const step = 1.05 / FENCE_R;                                    // 半徑變大，柱子間距維持差不多
  for (let a = 0; a < Math.PI * 2; a += step) {
    if (GATES.some(g => angDiff(a, g.a) < g.half)) continue;
    const p = box(0.22, 0.9, 0.22, mats.wood); p.position.set(Math.cos(a) * FENCE_R, 0.45, Math.sin(a) * FENCE_R); fencePosts.add(p);
  }
}
buildFence();
// 雙開木門：兩片門板各自繞門柱轉，往外打開
const doors = [];
function makeDoors(g, tall) {
  const group = new THREE.Group();
  const [mx, mz] = gatePoint(g, FENCE_R * Math.cos(g.half));
  const leaves = [];
  [-1, 1].forEach(side => {
    const ex = Math.cos(g.a + side * g.half) * FENCE_R, ez = Math.sin(g.a + side * g.half) * FENCE_R;
    const len = Math.hypot(mx - ex, mz - ez), base = Math.atan2(-(mz - ez), mx - ex);
    const pivot = new THREE.Group(); pivot.position.set(ex, 0, ez); pivot.rotation.y = base;
    for (let x = 0.3; x < len; x += 0.55) {
      const h = tall ? 1.5 + Math.abs(Math.sin(x * 3)) * 0.4 : 1.0;
      const p = box(tall ? 0.4 : 0.3, h, tall ? 0.4 : 0.3, mats.wood); p.position.set(x, h / 2, 0); pivot.add(p);
    }
    const bar = box(len, 0.18, 0.14, mats.trunk); bar.position.set(len / 2, tall ? 1.1 : 0.7, 0.2); pivot.add(bar);
    const t = base + 1.2; // 往外開：轉完門板尖端要離營地中心更遠
    const sign = Math.cos(t) * Math.cos(g.a) + -Math.sin(t) * Math.sin(g.a) > Math.cos(base) * Math.cos(g.a) + -Math.sin(base) * Math.sin(g.a) ? 1 : -1;
    leaves.push({ pivot, base, sign });
    group.add(pivot);
  });
  scene.add(group);
  const d = { group, leaves, open: 0, x: mx, z: mz };
  doors.push(d);
  return d;
}
let southDoors = makeDoors(GATES[1], false), eastDoors = makeDoors(GATES[2], false);
function updateDoors(dt) {
  const movers = [player.position, ...workers.map(w => w.g.position), ...villagers.map(v => v.g.position), ...leaving.map(l => l.g.position)];
  for (const d of doors) {
    if (d === eastDoors && !save.east) continue;                     // 東邊還被冰牆擋著，東門不開
    const near = movers.some(p => Math.hypot(p.x - d.x, p.z - d.z) < 3.8);
    d.open += ((near ? 1 : 0) - d.open) * Math.min(1, dt * 8);
    d.leaves.forEach(l => l.pivot.rotation.y = l.base + l.sign * d.open * 1.45);
  }
}

// ===== 北極熊：在北邊森林閒晃，打倒掉肉，過一陣子重生 =====
const bears = [];
function bearSpot() { let x, z; do { x = rand(-12, 8); z = rand(-FENCE_R - 14, -FENCE_R - 2.3); } while (nearNorthDoors(x, z, 2)); return [x, z]; }
for (let i = 0; i < CFG.bearCount; i++) {
  const g = new THREE.Group();
  const bd = box(1.5, 0.9, 0.95, mats.fur); bd.position.y = 0.75; g.add(bd);
  const hd = box(0.6, 0.55, 0.6, mats.fur); hd.position.set(0, 0.95, 0.95); g.add(hd);
  const nose = box(0.25, 0.2, 0.2, M(0x333333)); nose.position.set(0, 0.9, 1.3); g.add(nose);
  [-0.2, 0.2].forEach(ex => { const e = box(0.14, 0.14, 0.1, mats.fur); e.position.set(ex, 1.28, 0.85); g.add(e); });
  [[-0.5, -0.3], [0.5, -0.3], [-0.5, 0.3], [0.5, 0.3]].forEach(([lx, lz]) => { const l = box(0.3, 0.45, 0.3, mats.fur); l.position.set(lx * 0.8, 0.22, lz * 1.2); g.add(l); });
  bd.rotation.y = Math.PI / 2; // 身體朝 +z
  const [x, z] = bearSpot();
  g.position.set(x, 0, z); scene.add(g);
  bears.push({ g, x, z, isBear: true, hp: CFG.bearHp, alive: true, respawn: 0, dir: rand(0, 6.28), turn: 0, shake: 0, pop: 0 });
}
function updateBears(dt) {
  for (const b of bears) {
    if (!b.alive) {
      b.g.scale.setScalar(Math.max(0.001, b.g.scale.x - dt * 4));
      b.respawn -= dt;
      if (b.respawn <= 0) { [b.x, b.z] = bearSpot(); b.alive = true; b.hp = CFG.bearHp; b.aggro = false; }
      b.g.position.set(b.x, 0, b.z);
      continue;
    }
    if (b.g.scale.x < 1) b.g.scale.setScalar(Math.min(1, b.g.scale.x + dt * 2));
    b.turn -= dt;
    if (b.turn <= 0) { b.turn = rand(1.5, 4); b.dir = rand(0, 6.28); b.idle = Math.random() < 0.35; }
    if (b.aggro && b.shake <= 0) {                 // 熊群來襲：衝向北門，北門破了就去拆最近的建築
      let tx, tz, reach = 0.3, prey = null;
      if (gate.hp > 0) { tx = Math.max(-3, Math.min(3, b.x)); tz = -FENCE_R - 1.1; }
      else {
        prey = buildings.filter(o => !o.dead).sort((p, q) => Math.hypot(p.x - b.x, p.z - b.z) - Math.hypot(q.x - b.x, q.z - b.z))[0];
        if (prey) { tx = prey.x; tz = prey.z; reach = prey.r + 0.9; } else { tx = CX; tz = CZ - 1.5; }
        const bearIn = Math.hypot(b.x, b.z) < FENCE_R, preyIn = Math.hypot(tx, tz) < FENCE_R;
        const inGateBand = Math.abs(b.x) < 3 && b.z > -FENCE_R - 1.9 && b.z < -FENCE_R + 2.1;
        if (bearIn !== preyIn && !inGateBand) { tx = Math.max(-2.5, Math.min(2.5, b.x)); tz = bearIn ? -FENCE_R + 1.7 : -FENCE_R - 1.3; reach = 0.3; prey = null; } // 進出營地都走北門
      }
      const dx = tx - b.x, dz = tz - b.z, d = Math.hypot(dx, dz);
      if (d > reach) { b.dir = Math.atan2(dx, dz); b.x += dx / d * 2.2 * dt; b.z += dz / d * 2.2 * dt; }
      else if (gate.hp > 0) { gate.hp -= CFG.bearDps * dt; gate.hit = 0.2; }
      else if (prey) { b.dir = Math.atan2(dx, dz); prey.hp -= CFG.bearBuildDps * dt; prey.hit = 0.2; }
    } else if (b.shake <= 0 && huntable(b)) {     // 野外的熊：主角在營地外又靠太近，就追過去打
      const dx = player.position.x - b.x, dz = player.position.z - b.z, d = Math.hypot(dx, dz);
      b.dir = Math.atan2(dx, dz); b.hunting = true;
      if (d > 1.3) { b.x += dx / d * 2.4 * dt; b.z += dz / d * 2.4 * dt; }
      else if (hurtCd <= 0) { hero.hp -= CFG.bearHitDps * dt; hero.hit = 0.15; }
    } else if (!b.idle && b.shake <= 0) {
      b.hunting = false;
      b.x += Math.sin(b.dir) * 1.2 * dt; b.z += Math.cos(b.dir) * 1.2 * dt;
      if (b.x < -13 || b.x > 9 || b.z < -FENCE_R - 15 || b.z > -FENCE_R - 1.3) { b.dir = Math.atan2(-2 - b.x, -FENCE_R - 8 - b.z); b.x += Math.sin(b.dir) * 1.5 * dt; b.z += Math.cos(b.dir) * 1.5 * dt; } // 追完人慢慢走回森林
    }
    if (!b.aggro && !b.hunting && nearNorthDoors(b.x, b.z, 1.6)) {  // 平常閒晃的熊不靠近北門，碰到就往北走開
      b.z -= 2.5 * dt; b.dir = Math.PI + rand(-0.6, 0.6); b.idle = false;
    }
    b.g.position.set(b.x, 0, b.z);
    b.g.rotation.y = b.dir;
    if (b.shake > 0) { b.shake -= dt; b.g.rotation.z = Math.sin(b.shake * 60) * 0.12; } else b.g.rotation.z = 0;
    if (b.pop > 0) { b.pop -= dt; b.g.scale.setScalar(1 + Math.max(0, b.pop)); }
  }
}

function updateVillagers(dt) {
  // 排隊的村民跟著人口變多（最多 16 個，手機效能）
  while (villagers.length < Math.min(16, 4 + Math.floor(population() / 3))) villagers.push(makeVillager(villagers.length));
  villagers.forEach((v, i) => {
    const p = QUEUE(i), d = p.sub(v.g.position); d.y = 0;
    const len = d.length();
    if (len > 0.05) { v.g.position.addScaledVector(d, Math.min(1, 3 * slowAt(v.g.position.x, v.g.position.z) * dt / len)); v.g.position.y = Math.abs(Math.sin(guideT * 10 + i)) * 0.08; }
    else v.g.position.y = 0;
  });
  const front = villagers[0];
  const scared = bears.some(b => b.alive && b.aggro && Math.hypot(b.x, b.z) < FENCE_R + 0.3); // 熊進營地，村民不敢買

  if (front && !scared && !blocked && bbq.cookedMeshes.length && front.g.position.distanceTo(QUEUE(0)) < 0.3) {
    front.wait += dt;

      const m = bbq.cookedMeshes.pop();

      fly(m, wp, () => front.g.position.clone().add(tmp.set(0, 1.4, 0)), 0.25, () => { front.g.add(m); m.position.set(0, 0.9, 0.35); }, 0.6);
      spawnBill(bbq, front.g.position.clone().add(tmp.set(0, 1.4, 0)));
      villagers.shift(); leaving.push({ g: front.g, t: 3.5, dir: rand(-0.12, 0.12) });
    }
  }
  for (let i = leaving.length - 1; i >= 0; i--) {
    const l = leaving[i]; l.t -= dt;
    l.g.position.x += Math.sin(l.dir) * 2.5 * dt; l.g.position.z += Math.cos(l.dir) * 2.5 * dt;
    l.g.rotation.y = l.dir; l.g.position.y = Math.abs(Math.sin(l.t * 10)) * 0.1;

  }
}

function routeTo(w, x, z, dt) {

  const ref = rIn ? Math.atan2(z, x) : Math.atan2(pz, px);
  const g = GATES.filter(g => g !== GATES[2] || save.east).reduce((a, b) => angDiff(ref, a.a) < angDiff(ref, b.a) ? a : b);
  const inBand = angDiff(Math.atan2(pz, px), g.a) < g.half - 0.1 && Math.abs(Math.hypot(px, pz) - FENCE_R) < 1.2;

  const goInside = rIn ? !inBand : inBand;

}
function updateWorkers(dt) {
  for (const w of workers) {
    if (w.load >= CFG.workerLoad) {                 // 揹滿了：送去鋸木廠
      const ip = mills[0].inPad.position;
      if (routeTo(w, ip.x, ip.z, dt)) {
        mills[0].queue += w.load; w.load = 0;

      }
      continue;
    }
    if (!w.tree || !w.tree.alive) {                  // 找最近、沒人在砍的樹
      let best = 1e9; w.tree = null;
      for (const t of trees) {
        if (!t.alive || t.locked || t.coal || workers.some(o => o !== w && o.tree === t)) continue;
        const d = (t.x - w.g.position.x) ** 2 + (t.z - w.g.position.z) ** 2;
        if (d < best) { best = d; w.tree = t; }
      }
      if (!w.tree) continue;
    }

        t.hp--; t.shake = 0.25; t.pop = 0.15; burstChips(t.x, t.z);
        if (t.hp <= 0) {

}

// ===== 操作：浮動搖桿＋鍵盤 =====
const joy = { active: false, id: null, ox: 0, oy: 0, x: 0, y: 0 };
const joyEl = $('joy'), knob = $('knob');
addEventListener('pointerdown', e => {
  if (e.target.id === 'reset' || e.target.id === 'mute' || e.target.closest('#planBar, #planBtn')) return;
  if (plan.on) return planPointer('down', e);
  if (joy.active) return;
  joy.active = true; joy.id = e.pointerId; joy.ox = e.clientX; joy.oy = e.clientY; joy.x = joy.y = 0;
  joyEl.style.left = e.clientX + 'px'; joyEl.style.top = e.clientY + 'px'; joyEl.style.display = 'block';
  knob.style.transform = '';
});
addEventListener('pointermove', e => {
  if (plan.on) return planPointer('move', e);
  if (!joy.active || e.pointerId !== joy.id) return;
  let dx = e.clientX - joy.ox, dy = e.clientY - joy.oy;
  const len = Math.hypot(dx, dy), R = 50;
  if (len > R) { dx *= R / len; dy *= R / len; }
  joy.x = dx / R; joy.y = dy / R;
  knob.style.transform = `translate(${dx}px,${dy}px)`;
});
function joyEnd(e) { if (plan.on) planPointer('up', e); if (e.pointerId === joy.id) { joy.active = false; joy.x = joy.y = 0; joyEl.style.display = 'none'; } }

const camBase = new THREE.Vector3(7, 15, 11), camOffset = camBase.clone();

}

const guide = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1, 4), new THREE.MeshBasicMaterial({ color: 0xffc400, depthTest: false }));
guide.rotation.x = Math.PI; guide.renderOrder = 22; scene.add(guide);
let guideT = 0;
function updateGuide(dt) {
  guideT += dt;
  guide.visible = save.bag + save.axe < 2; // 買過兩次升級就不再指引
  if (!guide.visible) return;
  let x, z, h = 2.2;
  const out = mills.find(m => m.out.length);
  const aff = unlocks.find(u => !u.done && u.price() - u.paid <= save.cash);
  if (out) { x = out.outPad.position.x; z = out.outPad.position.z; }
  else if (carried.length >= Math.min(capacity(), 9)) { const s = mills.find(m => m.accept === carried[carried.length - 1].userData.type) || { inPad: fg }; x = s.inPad.position.x; z = s.inPad.position.z; }
  else if (aff && !carried.length) { x = aff.x; z = aff.z; h = 3.2; }
  else {
    let best = 1e9;
    for (const t of trees) {
      if (!t.alive || t.locked) continue;
      const d = (t.x - player.position.x) ** 2 + (t.z - player.position.z) ** 2;
      if (d < best) { best = d; x = t.x; z = t.z; }
    }
    h = 4;
  }
  guide.position.set(x, h + Math.abs(Math.sin(guideT * 4)) * 0.6, z);
  guide.rotation.y += dt * 3;
}

// ===== 主迴圈 =====
const tmp = new THREE.Vector3();
let chopTimer = 0, dropTimer = 0, fullWarn = 0, saveTimer = 0, walk = 0;
const clock = new THREE.Clock();

// 主角血量：被熊打會扣，在營地裡會慢慢回血；被打倒就掉一半背包、回營地
const hero = { hp: CFG.playerHp, hit: 0 };
let hurtCd = 0;
function huntable(b) {
  return !b.aggro && hurtCd <= 0 && Math.hypot(player.position.x, player.position.z) > FENCE_R + 0.3 &&
    Math.hypot(player.position.x - b.x, player.position.z - b.z) < (b.hunting ? CFG.bearChase + 2 : CFG.bearChase);
}
// 離暖氣圈邊緣多遠（≤0 表示在暖氣裡）：火爐的圈和暖氣塔的圈取最近的那個
function coldOver(x, z) {
  let over = Math.hypot(x - FX, z - FZ) - furnace.r;
  const hr = furnace.fuel > 0 ? CFG.heaterR * (coldWave.on > 0 ? CFG.coldShrink : 1) : 0;
  for (const h of heaters) if (!h.bld.dead) over = Math.min(over, Math.hypot(x - h.x, z - h.z) - hr);
  return over;
}
function updateHero(dt) {
  hurtCd -= dt;
  hero.over = coldOver(player.position.x, player.position.z);
  if (hero.over <= 0) hero.hp = Math.min(CFG.playerHp, hero.hp + CFG.heal * dt);   // 在暖氣裡回血
  else {                                                                            // 野外會冷到掉血，離越遠掉越多
    const dps = Math.min(CFG.coldMax, CFG.coldBase + hero.over * CFG.coldPerUnit) * (coldWave.on > 0 ? 1.5 : 1);
    hero.hp -= dps * dt; if (hero.hp <= 0) hero.cause = 'cold';
  }
  if (hero.hit > 0) { hero.hit -= dt; player.children[0].material.emissive?.setHex(0x661111); } else player.children[0].material.emissive?.setHex(0);
  if (hero.hp <= 0) {
    const lose = carried.splice(Math.ceil(carried.length / 2));  // 掉一半背包
    lose.forEach(m => stackRoot.remove(m)); restack();
    player.position.set(0, 0, 2); camera.position.copy(player.position).add(camOffset);
    hero.hp = CFG.playerHp; hurtCd = 3;                         // 回營地，3 秒內熊不會再追
    bears.forEach(b => b.hunting = false);
    const why = hero.cause === 'cold' ? '凍昏了！' : '被熊打倒了！'; hero.cause = null;
    toast(lose.length ? why + '掉了 ' + lose.length + ' 個東西' : why);
    beep(140, 0.5, 'sawtooth', 0.07, 0.5);
  }
  const v = Math.ceil(hero.hp); $('hp').textContent = v;
  $('hpBar').firstElementChild.style.width = v + '%'; $('hpBar').classList.toggle('danger', v < 35);
  updateAlert();
}

// 目標提示（作者 10/17 回饋第 2 項）：畫面上方告訴玩家下一步做什麼；完成一個給一點獎金
const GOALS = [
  { t: () => '升級任意 3 個項目（' + Math.min(save.buys, 3) + '/3）', done: () => save.buys >= 3 },
  { t: () => '升級營火，擴大領地', done: () => save.territory >= 1 },
  { t: () => '開拓東邊，打開新場地', done: () => !!save.east },
  { t: () => '蓋民房，人口到 20（' + population() + '/20）', done: () => save.level >= 1 },
  { t: () => '開採煤礦，煤很耐燒', done: () => !!save.mine },
  { t: () => '營火升級 Lv2，領地再擴大', done: () => save.territory >= 2 },

  { t: () => '把營火進化成石爐（營火 Lv4）', done: () => save.stove >= 1 },

];
save.goal = Math.min(save.goal || 0, GOALS.length - 1); // 匯入的存檔碼可能不對，不要超出範圍
let shownGoal = '', goalFlash = 0;
function updateGoal(dt) {

  }

}

// 畫面上方的事件提醒：熊群、寒潮快來（15 秒內）或正在發生時才出現，平常不讀秒
let shownAlert = '';
function updateAlert() {
  let t = '', cls = '';
  if (gate.raiding) { t = '🐻 熊群來襲！守住北門'; }
  else if (save.level >= 1 && coldWave.on > 0) { t = '❄️ 寒潮中 ' + Math.ceil(coldWave.on) + ' 秒，顧好營火'; cls = 'cold'; }
  else if (hero.over > 0 && hero.hp < 60) { t = '🥶 好冷！回營火旁取暖'; cls = 'cold'; }
  else if (gate.raidT <= 15) { t = '🐻 ' + raidCount() + ' 隻熊 ' + Math.ceil(gate.raidT) + ' 秒後來襲'; cls = 'warn'; }
  else if (save.level >= 1 && coldWave.t <= 15) { t = '❄️ 寒潮 ' + Math.ceil(coldWave.t) + ' 秒後來，先加柴'; cls = 'cold'; }
  const key = t + cls; if (key === shownAlert) return; shownAlert = key;
  $('alert').textContent = t; $('alert').className = cls; $('alert').style.display = t ? 'block' : 'none';
}

// 建築：被打會晃、血量存檔、揹木頭靠近就修、全部被拆光就失敗
let fixCd = 0, gameOver = false;
function updateBuildings(dt) {
  fixCd -= dt;
  for (const b of buildings) {
    b.hp = Math.max(0, b.hp);
    if (b.hit > 0) { b.hit -= dt; b.g.position.x = b.x + Math.sin(b.hit * 80) * 0.08; } else b.g.position.x = b.x;
    const k = carried.map(m => m.userData.type).lastIndexOf('log');
    if (b.hp + (b.pend || 0) * 10 < CFG.buildHp && k >= 0 && fixCd <= 0 && Math.hypot(player.position.x - b.x, player.position.z - b.z) < b.r + 1.1) {
      fixCd = 0.12; b.pend = (b.pend || 0) + 1; // 飛在半空中的木頭也算，修滿就不再拿
      const m = carried.splice(k, 1)[0]; const wp = m.getWorldPosition(new THREE.Vector3());
      stackRoot.remove(m); restack();
      fly(m, wp, () => new THREE.Vector3(b.x, 1.2, b.z), 0.3, () => { scene.remove(m); b.pend--; b.hp = Math.min(CFG.buildHp, b.hp + 10); if (b.hp >= CFG.buildHp) sfx.coin(); });
    }
    const wasDead = b.dead;
    setBuildingState(b);
    if (b.dead && !wasDead) { toast('🐻 熊把建築拆掉了！揹木頭去修！'); beep(160, 0.4, 'sawtooth', 0.06, 0.5); }
    save.bhp[b.key] = Math.round(b.hp * 10) / 10;
  }
  if (!gameOver && buildings.length && buildings.every(b => b.dead)) {
    gameOver = true; writeSave(); $('lose').style.display = 'flex';
  }
}

function step(dt) {
  if (gameOver || paused) return;
  // 移動
  let ix = joy.x, iy = joy.y;
  if (keys.KeyA || keys.ArrowLeft) ix -= 1; if (keys.KeyD || keys.ArrowRight) ix += 1;
  if (keys.KeyW || keys.ArrowUp) iy -= 1; if (keys.KeyS || keys.ArrowDown) iy += 1;
  const il = Math.hypot(ix, iy); if (il > 1) { ix /= il; iy /= il; }
  const mx = right.x * ix + fwd.x * -iy, mz = right.y * ix + fwd.y * -iy;
  const moving = Math.hypot(mx, mz) > 0.05;
  if (moving) {
    if (hintOn) { hintOn = false; $('hint').style.display = 'none'; }
    const sp = CFG.speed * slowAt(player.position.x, player.position.z) * dt; // 踩到雪堆走很慢
    let nx = player.position.x + mx * sp, nz = player.position.z + mz * sp;
    if (!save.east && nx > 15.2) nx = 15.2;           // 冰牆擋住
    nx = Math.max(-40, Math.min(40, nx)); nz = Math.max(-40, Math.min(40, nz));
    for (const t of trees) {                          // 不要穿過樹幹
      if (!t.alive || (t.coal && t.locked)) continue;
      const dx = nx - t.x, dz = nz - t.z, d = Math.hypot(dx, dz);
      if (d < 0.7 && d > 0) { nx = t.x + dx / d * 0.7; nz = t.z + dz / d * 0.7; }
    }
    const r1 = Math.hypot(nx, nz);                     // 圍欄擋住，只有門口過得去
    if (Math.abs(r1 - FENCE_R) < 0.4 && !inGate(nx, nz)) {
      const k = (Math.hypot(player.position.x, player.position.z) < FENCE_R ? FENCE_R - 0.4 : FENCE_R + 0.4) / r1;
      nx *= k; nz *= k;
    }
    player.position.x = nx; player.position.z = nz;
    player.rotation.y = Math.atan2(mx, mz);
    walk += dt * 12;
  }
  player.position.y = moving ? Math.abs(Math.sin(walk)) * 0.12 : 0;
  // 背上的木頭會跟著晃
  carried.forEach((m, i) => { m.position.x = Math.sin(walk * 0.5) * i * 0.012; });

  // 自動砍樹
  chopTimer -= dt;
  let target = null, best = CFG.chopRange;
  for (const t of trees) {
    if (!t.alive || t.locked) continue;
    const d = Math.hypot(t.x - player.position.x, t.z - player.position.z);
    if (d < best) { best = d; target = t; }
  }
  for (const b of bears) { // 熊優先：範圍內有熊就先打熊
    if (!b.alive) continue;
    if (Math.hypot(b.x - player.position.x, b.z - player.position.z) < CFG.chopRange + 0.4) { target = b; break; }
  }
  if (target) {
    const kind = target.isBear ? 'meat' : target.coal ? 'coal' : 'log';
    if (countOf(kind) >= capacity()) {
      fullWarn -= dt; if (fullWarn <= 0) { toast(kind === 'meat' ? '肉滿了！拿去烤肉攤' : kind === 'coal' ? '煤滿了！拿去火爐' : '木頭滿了！拿去鋸木廠'); fullWarn = 3; }
    } else {
      axeShow = 0.3;
      if (chopTimer <= 0) {
        chopTimer = CFG.chopInterval[save.axe];
        target.hp--; target.shake = 0.25; target.pop = 0.15;
        burstChips(target.x, target.z, target.isBear); sfx.chop();
        if (target.hp <= 0) {
          target.alive = false;
          if (target.isBear) target.respawn = CFG.bearRespawn; else target.regrow = target.coal ? CFG.coalRegrow : CFG.treeRegrow;
          const n = target.isBear ? CFG.meatPerBear : target.coal ? CFG.coalPerRock : CFG.logsPerTree;
          for (let i = 0; i < n; i++) {
            if (countOf(kind) >= capacity()) break;
            const idx = stackHeight();
            const m = new THREE.Mesh(logGeo, mats[kind === 'log' ? 'log' : kind]); m.castShadow = true;
            m.userData.type = kind;
            const f = { toBack: kind };
            fly(m, tmp.set(target.x, 1 + i * 0.3, target.z), () => stackRoot.localToWorld(new THREE.Vector3(0, idx * 0.24, 0)), 0.35 + i * 0.08, () => {
              stackRoot.add(m); carried.push(m); restack();
            });
            Object.assign(flies[flies.length - 1], f);
          }
        }
      }
    }
  }
  // 斧頭旋轉特效
  axeShow -= dt;
  axe.visible = axeShow > 0;
  if (axe.visible) {
    axeSpin += dt * (12 + save.axe * 3);
    axe.position.set(player.position.x, 1.2, player.position.z);
    axeArm.rotation.y = axeSpin;
    swooshG.rotation.y = axeSpin - Math.PI / 2 - 2.4; // 刀光拖在斧頭後面
    swooshMat.opacity = Math.min(0.55, axeShow * 3);
    axeHeadMat.color.setHex(AXE_COLORS[save.axe]);
  }
  for (let i = chips.length - 1; i >= 0; i--) {
    const c = chips[i]; c.life -= dt; c.vy -= 18 * dt;
    c.m.position.x += c.vx * dt; c.m.position.y = Math.max(0.08, c.m.position.y + c.vy * dt); c.m.position.z += c.vz * dt;
    c.m.rotation.x += dt * 10; c.m.scale.setScalar(Math.max(0.01, c.life / 0.6));
    if (c.life <= 0) { scene.remove(c.m); chips.splice(i, 1); }
  }
  // 樹的搖晃與重生
  for (const t of trees) {
    if (t.shake > 0) { t.shake -= dt; t.g.rotation.z = Math.sin(t.shake * 60) * 0.15; } else t.g.rotation.z = 0;
    if (t.pop > 0) { t.pop -= dt; if (t.alive) t.g.scale.setScalar(t.sc * (1 + Math.max(0, t.pop))); }
    if (!t.alive) {
      t.g.scale.setScalar(Math.max(0.001, t.g.scale.x - dt * 4));
      t.regrow -= dt;
      if (t.regrow <= 0) { t.alive = true; t.hp = t.coal ? CFG.coalHp : CFG.treeHp; }
    } else if (t.g.scale.x < t.sc) t.g.scale.setScalar(Math.min(t.sc, t.g.scale.x + dt * 1.5));
  }

  // 鋸木廠：卸貨、加工、收錢
  dropTimer -= dt;
  for (const mill of mills) {
    const ip = mill.inPad.position, op = mill.outPad.position;
    if (mill.bld.dead) { mill.label.set([mill.name]); continue; }
    const k = carried.map(m => m.userData.type).lastIndexOf(mill.accept); // 只收這個站要的東西
    if (k >= 0 && dropTimer <= 0 && Math.hypot(player.position.x - ip.x, player.position.z - ip.z) < 1.3) {
      dropTimer = 0.07;
      const m = carried.splice(k, 1)[0]; const wp = m.getWorldPosition(new THREE.Vector3());
      stackRoot.remove(m); restack();
      fly(m, wp, () => mill.g.position.clone().add(tmp.set(0, 1.6, 0)), 0.3, () => { scene.remove(m); mill.queue++; });
    }
    const cold = mill.bld.cold; // 暖氣圈外：停工，但綠框裡的錢還是能收
    if (!cold) mill.saw.rotation.y += dt * (mill.queue ? 20 : 2);
    if (mill.queue > 0 && !cold) {
      mill.timer += dt;
      if (mill.timer >= mill.time) {
        mill.timer = 0; mill.queue--;
        if (mill.customers) addCooked(mill); else spawnBill(mill, mill.g.position.clone().add(tmp.set(1.2, 1, 1)));
      }
    } else if (!cold) mill.timer = 0;
    mill.label.set(mill.queue ? [mill.name, (cold ? '凍住了 ' : '加工中 ') + mill.queue] : [mill.name]);
    if (mill.out.length && Math.hypot(player.position.x - op.x, player.position.z - op.z) < 1.4) {
      const bills = mill.out.splice(0);
      bills.forEach((b, i) => {
        const wp = b.position.clone();
        fly(b, wp, () => player.position.clone().add(tmp.set(0, 2.2, 0)), 0.25 + i * 0.02, () => {
          scene.remove(b); save.cash += mill.value; sfx.coin();
        }, 1);
      });
    }
  }

  // 付款格
  for (const u of unlocks) {
    if (u.done) continue;
    if (u.cool > 0) { u.cool -= dt; u.pad.visible = u.label.visible = u.cool <= 0; continue; } // 剛升級完：閃亮後要等一下才能再升級
    const p = u.price();
    const dist = Math.hypot(player.position.x - u.x, player.position.z - u.z), on = dist < 1.2;
    const near = dist < 6; if (near !== u.near) { u.near = near; u.refresh(); }
    u.stand = on ? (u.stand || 0) + dt : 0;                     // 站穩 0.6 秒才開始付錢，路過不會誤買
    if (on && u.stand > CFG.padDelay && save.cash > 0 && u.paid < p) {
      u.payAcc += dt * p / CFG.payRate;
      const pay = Math.min(Math.floor(u.payAcc), save.cash, p - u.paid);
      if (pay > 0) {
        u.payAcc -= pay; save.cash -= pay; u.paid += pay;
        const b = box(0.5, 0.1, 0.3, mats.cash);
        fly(b, player.position.clone().add(tmp.set(0, 2, 0)), () => new THREE.Vector3(u.x, 0.1, u.z), 0.25, () => scene.remove(b), 1);
      }
      if (u.paid >= p) { u.paid = 0; u.payAcc = 0; sparkle(u.x, u.z); u.buy(); save.buys++; sfx.unlock(); u.cool = CFG.buildCool; levelUnlocks(); writeSave(); }
      u.refresh();
    } else u.payAcc = 0;
  }

  coinCd -= dt;
  updateGuide(dt);
  updateBears(dt);
  updateVillagers(dt);
  updateTower(dt);
  updateWorkers(dt);
  updateGate(dt);
  updateColdWave(dt);
  updateSnow(dt);
  if (roadsDirty) rebuildRoads();
  updateFurnace(dt);
  updateBuildings(dt);
  checkLevel();
  updateHero(dt);
  updateGoal(dt);
  updateDoors(dt);
  // 飛行動畫
  for (let i = flies.length - 1; i >= 0; i--) {
    const f = flies[i]; f.t += dt;
    const k = Math.min(1, f.t / f.dur), to = f.toFn();
    f.mesh.position.lerpVectors(f.from, to, k);
    f.mesh.position.y += Math.sin(k * Math.PI) * f.arc;
    if (f.spin !== false) f.mesh.rotation.y += dt * 8;
    if (k >= 1) { flies.splice(i, 1); f.onDone && f.onDone(); }
  }

  // 下雪
  for (let i = 0; i < snowN; i++) {
    snowPos[i * 3 + 1] -= dt * (coldWave.on > 0 ? 5 : 1.5); // 寒潮時雪下得又快又急
    if (snowPos[i * 3 + 1] < 0) {
      snowPos[i * 3 + 1] = 18;
      snowPos[i * 3] = player.position.x + rand(-25, 25); snowPos[i * 3 + 2] = player.position.z + rand(-25, 25);
    }
  }
  snowGeo.attributes.position.needsUpdate = true;

  // 鏡頭跟隨
  camera.position.lerp(tmp.copy(player.position).add(camOffset), 1 - Math.exp(-dt * 6));
  camera.lookAt(player.position.x, 0.8, player.position.z);
  sun.position.set(player.position.x - 10, 20, player.position.z + 8);
  sun.target.position.copy(player.position);

  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').style.opacity = 0; }
  saveTimer += dt; if (saveTimer > 2) { saveTimer = 0; writeSave(); }
  hud();
}

camera.position.copy(player.position).add(camOffset);
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (plan.on) planCamera(dt); else step(dt);
  document.getElementById('planBtn').style.display = (save.level >= 1 || PRO) && !plan.on && !gameOver ? 'block' : 'none';
  renderer.render(scene, camera);
}
loop();
addEventListener('visibilitychange', () => { if (document.hidden) writeSave(); });
// 選單：換關卡會先存好目前這一關，再切到另一關的存檔
function showMenu(on) {
  $('menu').style.display = on ? 'flex' : 'none'; paused = on;
  $('menuClose').style.display = $('menuReset').style.display = firstRun && !menuSeen ? 'none' : ''; // 第一次玩只能選關卡
  document.querySelectorAll('#menu [data-mode]').forEach(b => b.classList.toggle('cur', b.dataset.mode === MODE));
}
let menuSeen = false;
document.getElementById('reset').onclick = () => { menuSeen = true; showMenu(true); };
document.getElementById('menuClose').onclick = () => showMenu(false);
document.querySelectorAll('#menu [data-mode]').forEach(b => b.onclick = () => {
  try { localStorage.setItem(MODE_KEY, b.dataset.mode); } catch (e) {}
  if (b.dataset.mode === MODE && !resetting) { showMenu(false); return; }
  if (b.dataset.mode === MODE) { resetting = false; menuSeen = true; showMenu(false); writeSave(); return; }
  writeSave(); resetting = true; location.reload();
});
// 第一次玩：先選關卡，選好之前不存檔；之前玩過（有教學關存檔）的人直接記成教學關
if (firstRun) {
  let old = null; try { old = localStorage.getItem('frost-town-save-v1'); } catch (e) {}
  if (old) { try { localStorage.setItem(MODE_KEY, 'tutorial'); } catch (e) {} }
  else { resetting = true; showMenu(true); }
}
window.__game = { coldOver, fireStage: () => fireStage, raidCount, plan, setPlan, planPointer, canBuild, heaters, piles, shovelers, spawnPile, rocks, coldWave, hero, save, furnace, houses, player, carried, mills, unlocks, trees, bears, gate, buildings, towers, step, render: () => renderer.render(scene, camera) }; // 測試用
</script>
