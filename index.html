<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#cfe3f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>寒霜小鎮</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#cfe3f2;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
  canvas{display:block}
  #hud{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
  .pill{background:rgba(30,40,60,.72);color:#fff;border-radius:16px;padding:4px 12px 4px 8px;font-weight:700;font-size:18px;
    display:flex;align-items:center;gap:6px;min-width:76px}
  .pill b{font-size:20px}
  .pill.bump{animation:bump .25s}
  @keyframes bump{50%{transform:scale(1.15)}}
  #title{position:fixed;top:calc(10px + env(safe-area-inset-top));left:12px;color:#25415e;font-weight:900;font-size:20px;
    text-shadow:0 2px 0 #fff;pointer-events:none}
  #title small{display:block;font-size:12px;font-weight:700;opacity:.7}
  #reset{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));font-size:12px;border:0;border-radius:10px;
    padding:6px 10px;background:rgba(30,40,60,.45);color:#fff}
  #mute{position:fixed;left:96px;bottom:calc(12px + env(safe-area-inset-bottom));font-size:12px;border:0;border-radius:10px;
    padding:6px 10px;background:rgba(30,40,60,.45);color:#fff}
  #toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:rgba(30,40,60,.8);color:#fff;font-weight:700;
    padding:8px 16px;border-radius:14px;font-size:16px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
  #hint{position:fixed;left:50%;bottom:9%;transform:translateX(-50%);color:#25415e;font-weight:900;font-size:18px;
    text-shadow:0 2px 0 #fff;pointer-events:none;text-align:center;animation:blink 1.4s infinite}
  @keyframes blink{50%{opacity:.35}}
  #joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.25);
    border:3px solid rgba(255,255,255,.6);display:none;pointer-events:none}
  #knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.85)}
</style>
</head>
<body>
<div id="title">寒霜小鎮<small id="ver"></small></div>
<div id="hud">
  <div class="pill" id="pCash">💵 <b id="cash">0</b></div>
  <div class="pill" id="pMeat">🍖 <b id="meat">0</b></div>
  <div class="pill" id="pWood">🪵 <b id="wood">0</b><span id="cap" style="font-size:13px;opacity:.75"></span></div>
</div>
<div id="toast"></div>
<div id="hint"></div>
<div id="joy"><div id="knob"></div></div>
<button id="reset">重新開始</button>
<button id="mute"></button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const VERSION = '0.07';
document.getElementById('ver').textContent = 'v' + VERSION + '　灰盒原型';

// ===== 數值（之後平衡都改這裡） =====
const CFG = {
  speed: 6,                 // 主角移動速度
  chopRange: 1.9,           // 自動砍樹距離
  chopInterval: [0.45, 0.32, 0.22, 0.15], // 斧頭各等級的出手間隔（秒）
  treeHp: 3,
  logsPerTree: 3,
  treeRegrow: 12,           // 樹重新長出來的秒數
  capacity: [10, 20, 30, 45], // 背包各等級容量
  millTime: 0.6,            // 鋸木機每根木頭加工秒數
  logValue: 1,              // 一根木頭換幾元
  meatValue: 3,             // 一塊肉換幾元
  bearHp: 5, bearCount: 5, bearRespawn: 20, meatPerBear: 2,
  villagers: 6,             // 排隊的村民人數
  payRate: 1.1,             // 付款格：幾秒內付完整筆
};

// ===== 存檔 =====
const SAVE_KEY = 'frost-town-save-v1';
let save = { cash: 0, bag: 0, axe: 0, east: false, mill2: false };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); } catch (e) {}
function writeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
document.getElementById('reset').onclick = () => {
  if (confirm('確定要清除進度、重新開始嗎？')) { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} location.reload(); }
};

// ===== 場景 =====
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfe3f2);
scene.fog = new THREE.Fog(0xcfe3f2, 45, 90);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);

scene.add(new THREE.HemisphereLight(0xffffff, 0x9fb8d0, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.75);
sun.position.set(-10, 20, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -18, right: 18, top: 18, bottom: -18, near: 1, far: 60 });
scene.add(sun, sun.target);

const M = c => new THREE.MeshLambertMaterial({ color: c });
const mats = {
  snow: M(0xf4f8fc), dirt: M(0xc98c5a), trunk: M(0x7a4a2a), leaf: M(0x3f7f9a), leafSnow: M(0xe8f2fa),
  log: M(0xb06a35), meat: M(0xd9414a), fur: M(0xf2f0ea), cash: M(0x3fbf5a), wood: M(0x8a5a35), roof: M(0xb53a2e), player: M(0x2f8fd8),
  skin: M(0xffd6b0), ice: new THREE.MeshLambertMaterial({ color: 0xd6ecff, transparent: true, opacity: 0.85 }),
  axe: M(0xdfe6ee),
};
function box(w, h, d, mat) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.castShadow = m.receiveShadow = true; return m; }

// 地面：雪地＋營地泥土圓
const ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), mats.snow);
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const camp = new THREE.Mesh(new THREE.CircleGeometry(8.5, 40), mats.dirt);
camp.rotation.x = -Math.PI / 2; camp.position.y = 0.01; camp.receiveShadow = true; scene.add(camp);

// 文字標籤（價格、名稱）
function makeLabel(w = 256, h = 128) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const tex = new THREE.CanvasTexture(cv);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false }));
  sp.renderOrder = 10;
  let last = '';
  sp.set = (lines, color = '#fff') => {
    const key = lines.join('|') + color; if (key === last) return; last = key; // 文字沒變就不重畫
    const g = cv.getContext('2d'); g.clearRect(0, 0, w, h);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    lines.forEach((t, i) => {
      g.font = (i === 0 ? '900 44px' : '700 30px') + ' "Noto Sans TC","Microsoft JhengHei",sans-serif';
      g.lineWidth = 8; g.strokeStyle = 'rgba(30,40,60,.85)';
      const y = h / 2 + (i - (lines.length - 1) / 2) * 46;
      g.strokeText(t, w / 2, y); g.fillStyle = color; g.fillText(t, w / 2, y);
    });
    tex.needsUpdate = true;
  };
  return sp;
}

// 地上的虛線方框（投放點、付款格）
function makePad(x, z, size, color) {
  const g = new THREE.Group();
  const n = 8, seg = size / (n * 2);
  const mat = new THREE.MeshBasicMaterial({ color });
  for (let s = 0; s < 4; s++) for (let i = 0; i < n; i++) {
    const d = new THREE.Mesh(new THREE.PlaneGeometry(seg * 1.2, 0.12), mat);
    d.rotation.x = -Math.PI / 2;
    const t = -size / 2 + seg * (i * 2 + 0.5) + seg * 0.5;
    const e = size / 2;
    if (s === 0) d.position.set(t, 0, -e); if (s === 1) d.position.set(t, 0, e);
    if (s === 2) { d.position.set(-e, 0, t); d.rotation.z = Math.PI / 2; }
    if (s === 3) { d.position.set(e, 0, t); d.rotation.z = Math.PI / 2; }
    g.add(d);
  }
  const fill = new THREE.Mesh(new THREE.PlaneGeometry(size, size), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.35 }));
  fill.rotation.x = -Math.PI / 2; fill.position.y = -0.005; fill.scale.y = 0.0001;
  g.add(fill); g.fill = fill;
  g.position.set(x, 0.03, z); scene.add(g);
  return g;
}

// ===== 樹 =====
const trees = [];
function addTree(x, z, locked) {
  const g = new THREE.Group();
  const trunk = box(0.35, 0.8, 0.35, mats.trunk); trunk.position.y = 0.4; g.add(trunk);
  [[1.3, 1.3, 1.0], [1.0, 1.1, 1.7], [0.65, 0.9, 2.3]].forEach(([r, h, y]) => {
    const c = new THREE.Mesh(new THREE.ConeGeometry(r, h, 7), mats.leaf); c.position.y = y; c.castShadow = true; g.add(c);
    const s = new THREE.Mesh(new THREE.ConeGeometry(r * 0.55, h * 0.45, 7), mats.leafSnow); s.position.y = y + h * 0.3; g.add(s);
  });
  g.position.set(x, 0, z); g.rotation.y = Math.random() * 6;
  const sc = 0.85 + Math.random() * 0.35; g.scale.setScalar(sc);
  scene.add(g);
  trees.push({ g, x, z, hp: CFG.treeHp, alive: true, regrow: 0, sc, shake: 0, locked });
}
function rand(a, b) { return a + Math.random() * (b - a); }
// 北邊森林（一開始就能砍）
for (let i = 0; i < 70; i++) {
  const x = rand(-13, 9), z = rand(-22, -9);
  if (trees.every(t => (t.x - x) ** 2 + (t.z - z) ** 2 > 2.6)) addTree(x, z, false);
}
// 東邊森林（被冰牆擋住，要開拓）
for (let i = 0; i < 60; i++) {
  const x = rand(15, 30), z = rand(-12, 10);
  if (trees.every(t => (t.x - x) ** 2 + (t.z - z) ** 2 > 2.6)) addTree(x, z, true);
}
// 冰牆
const iceWall = new THREE.Group();
for (let z = -14; z <= 12; z += 1.6) {
  const b = box(1.4, rand(1.6, 2.6), 1.6, mats.ice); b.position.set(13 + rand(-0.2, 0.2), b.geometry.parameters.height / 2, z); iceWall.add(b);
}
scene.add(iceWall);
// 營地周圍的木樁圍欄（裝飾）
for (let a = 0; a < Math.PI * 2; a += 0.12) {
  if (a > -0.5 + Math.PI * 1.5 && a < 0.5 + Math.PI * 1.5) continue; // 北邊留出口
  if (a < 0.45 || a > Math.PI * 2 - 0.45) continue;                   // 東邊留出口
  const p = box(0.22, 0.9, 0.22, mats.wood); p.position.set(Math.cos(a) * 8.7, 0.45, Math.sin(a) * 8.7); scene.add(p);
}

// ===== 北極熊：在北邊森林閒晃，打倒掉肉，過一陣子重生 =====
const bears = [];
function bearSpot() { return [rand(-12, 8), rand(-23, -11)]; }
for (let i = 0; i < CFG.bearCount; i++) {
  const g = new THREE.Group();
  const bd = box(1.5, 0.9, 0.95, mats.fur); bd.position.y = 0.75; g.add(bd);
  const hd = box(0.6, 0.55, 0.6, mats.fur); hd.position.set(0, 0.95, 0.95); g.add(hd);
  const nose = box(0.25, 0.2, 0.2, M(0x333333)); nose.position.set(0, 0.9, 1.3); g.add(nose);
  [-0.2, 0.2].forEach(ex => { const e = box(0.14, 0.14, 0.1, mats.fur); e.position.set(ex, 1.28, 0.85); g.add(e); });
  [[-0.5, -0.3], [0.5, -0.3], [-0.5, 0.3], [0.5, 0.3]].forEach(([lx, lz]) => { const l = box(0.3, 0.45, 0.3, mats.fur); l.position.set(lx * 0.8, 0.22, lz * 1.2); g.add(l); });
  bd.rotation.y = Math.PI / 2; // 身體朝 +z
  const [x, z] = bearSpot();
  g.position.set(x, 0, z); scene.add(g);
  bears.push({ g, x, z, isBear: true, hp: CFG.bearHp, alive: true, respawn: 0, dir: rand(0, 6.28), turn: 0, shake: 0, pop: 0 });
}
function updateBears(dt) {
  for (const b of bears) {
    if (!b.alive) {
      b.g.scale.setScalar(Math.max(0.001, b.g.scale.x - dt * 4));
      b.respawn -= dt;
      if (b.respawn <= 0) { [b.x, b.z] = bearSpot(); b.alive = true; b.hp = CFG.bearHp; }
      b.g.position.set(b.x, 0, b.z);
      continue;
    }
    if (b.g.scale.x < 1) b.g.scale.setScalar(Math.min(1, b.g.scale.x + dt * 2));
    b.turn -= dt;
    if (b.turn <= 0) { b.turn = rand(1.5, 4); b.dir = rand(0, 6.28); b.idle = Math.random() < 0.35; }
    if (!b.idle && b.shake <= 0) {
      b.x += Math.sin(b.dir) * 1.2 * dt; b.z += Math.cos(b.dir) * 1.2 * dt;
      if (b.x < -13 || b.x > 9 || b.z < -24 || b.z > -10) { b.dir += Math.PI; b.x = Math.max(-13, Math.min(9, b.x)); b.z = Math.max(-24, Math.min(-10, b.z)); }
    }
    b.g.position.set(b.x, 0, b.z);
    b.g.rotation.y = b.dir;
    if (b.shake > 0) { b.shake -= dt; b.g.rotation.z = Math.sin(b.shake * 60) * 0.12; } else b.g.rotation.z = 0;
    if (b.pop > 0) { b.pop -= dt; b.g.scale.setScalar(1 + Math.max(0, b.pop)); }
  }
}

// ===== 鋸木廠 =====
function makeMill(x, z, opt = {}) {
  const o = Object.assign({ name: '鋸木廠', accept: 'log', value: CFG.logValue, time: CFG.millTime, roof: mats.roof }, opt);
  const g = new THREE.Group();
  const base = box(3, 1.6, 2.4, mats.wood); base.position.y = 0.8; g.add(base);
  const roof = box(3.4, 0.3, 2.8, o.roof); roof.position.y = 1.75; g.add(roof);
  const saw = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 0.08, 16), mats.axe);
  saw.rotation.x = Math.PI / 2; saw.position.set(0, 1.0, 1.25); g.add(saw);
  g.position.set(x, 0, z); scene.add(g);
  const inPad = makePad(x - 2.6, z + 2.2, 1.8, 0xffffff);
  const outPad = makePad(x + 2.6, z + 2.2, 1.8, 0x3fbf5a);
  const label = makeLabel(); label.scale.set(3, 1.5, 1); label.position.set(x, 3, z); label.set([o.name]); scene.add(label);
  return Object.assign(o, { g, saw, inPad, outPad, queue: 0, timer: 0, out: [], label });
}
const mills = [makeMill(3.5, -1)];
function addMill2() { mills.push(makeMill(-4.5, -1)); }
mills.push(makeMill(-3, -5.2, { name: '烤肉攤', accept: 'meat', value: CFG.meatValue, time: 0.8, roof: M(0xe07b22), customers: true }));

// 鈔票落到站的綠色框
function spawnBill(mill, from) {
  const op = mill.outPad.position, n = mill.out.length;
  const bill = box(0.7, 0.14, 0.45, mats.cash);
  const to = new THREE.Vector3(op.x + ((n % 4) % 2 - 0.5) * 0.75, 0.1 + Math.floor(n / 4) * 0.15, op.z + (Math.floor((n % 4) / 2) - 0.5) * 0.5);
  mill.out.push(bill);
  fly(bill, from, () => to, 0.3, null, 1);
}

// ===== 村民排隊買烤肉：烤好的肉放櫃台，排第一個的村民拿走並付錢 =====
const bbq = mills[1];
const counter = box(1.4, 0.8, 1, mats.wood); counter.position.set(-0.8, 0.4, -5.6); scene.add(counter);
bbq.cookedMeshes = [];
function addCooked(mill) {
  const m = new THREE.Mesh(logGeo, mats.meat); m.castShadow = true;
  const i = mill.cookedMeshes.length; mill.cookedMeshes.push(m);
  fly(m, mill.g.position.clone().add(tmp.set(0, 1.5, 0)), () => new THREE.Vector3(-0.8, 0.92 + i * 0.24, -5.6), 0.3, null, 1);
}
const QUEUE = i => new THREE.Vector3(-0.8, 0, -6.6 - i * 1.0); // 從櫃台往北邊出口排
const SHIRTS = [0x2f8fd8, 0x3fa66b, 0xd9a03f, 0x9b5fd0, 0xe06a6a];
const villagers = [], leaving = [];
function makeVillager(i) {
  const g = new THREE.Group();
  const b = box(0.55, 0.7, 0.4, M(SHIRTS[(Math.random() * SHIRTS.length) | 0])); b.position.y = 0.55; g.add(b);
  const h = box(0.42, 0.4, 0.4, mats.skin); h.position.y = 1.1; g.add(h);
  const c = box(0.48, 0.16, 0.45, M(0x24486b)); c.position.y = 1.36; g.add(c);
  const p = QUEUE(i + 4); g.position.set(p.x + rand(-0.3, 0.3), 0, p.z); g.rotation.y = Math.PI;
  scene.add(g);
  return { g, wait: 0 };
}
for (let i = 0; i < CFG.villagers; i++) villagers.push(makeVillager(i));
function updateVillagers(dt) {
  villagers.forEach((v, i) => {
    const p = QUEUE(i), d = p.sub(v.g.position); d.y = 0;
    const len = d.length();
    if (len > 0.05) { v.g.position.addScaledVector(d, Math.min(1, 3 * dt / len)); v.g.position.y = Math.abs(Math.sin(guideT * 10 + i)) * 0.08; }
    else v.g.position.y = 0;
  });
  const front = villagers[0];
  if (front && bbq.cookedMeshes.length && front.g.position.distanceTo(QUEUE(0)) < 0.3) {
    front.wait += dt;
    if (front.wait > 0.35) {
      const m = bbq.cookedMeshes.pop();
      const wp = m.position.clone();
      fly(m, wp, () => front.g.position.clone().add(tmp.set(0, 1.4, 0)), 0.25, () => { front.g.add(m); m.position.set(0, 0.9, 0.35); }, 0.6);
      spawnBill(bbq, front.g.position.clone().add(tmp.set(0, 1.4, 0)));
      villagers.shift(); leaving.push({ g: front.g, t: 3.5, dir: rand(-0.6, 0.6) });
      villagers.push(makeVillager(villagers.length));
    }
  }
  for (let i = leaving.length - 1; i >= 0; i--) {
    const l = leaving[i]; l.t -= dt;
    l.g.position.x += Math.sin(l.dir) * 2.5 * dt; l.g.position.z -= Math.cos(l.dir) * 2.5 * dt;
    l.g.rotation.y = Math.PI + l.dir; l.g.position.y = Math.abs(Math.sin(l.t * 10)) * 0.1;
    if (l.t <= 0) { scene.remove(l.g); leaving.splice(i, 1); }
  }
}

// ===== 付款格（解鎖） =====
const unlocks = [];
function makeUnlock(def) {
  const pad = makePad(def.x, def.z, 2, 0xffd34d);
  const label = makeLabel(320, 160); label.scale.set(3.2, 1.6, 1); label.position.set(def.x, 1.8, def.z); scene.add(label);
  const u = Object.assign({ pad, label, paid: 0, payAcc: 0 }, def);
  u.refresh = () => {
    const p = u.price();
    if (p == null) { scene.remove(pad); scene.remove(label); u.done = true; return; }
    label.set([u.name(), '💵 ' + (p - u.paid)], '#ffe066');
    pad.fill.scale.y = Math.max(0.0001, u.paid / p);
  };
  u.refresh(); unlocks.push(u);
  return u;
}
makeUnlock({ x: -2.5, z: 4.5, name: () => '背包擴充',
  price: () => [12, 35, 90][save.bag], buy: () => { save.bag++; toast('背包容量 ' + CFG.capacity[save.bag] + '！'); } });
makeUnlock({ x: 1.5, z: 5.5, name: () => '斧頭升級',
  price: () => [20, 60, 140][save.axe], buy: () => { save.axe++; toast('砍得更快了！'); } });
makeUnlock({ x: 10.5, z: 0, name: () => '開拓東邊',
  price: () => save.east ? null : 50, buy: () => { save.east = true; openEast(); toast('東邊森林開放了！'); } });
makeUnlock({ x: -5.5, z: 3, name: () => '第二台鋸木機',
  price: () => save.mill2 ? null : 80, buy: () => { save.mill2 = true; addMill2(); toast('加工速度翻倍！'); } });

function openEast() { scene.remove(iceWall); trees.forEach(t => t.locked = false); }
if (save.east) openEast();
if (save.mill2) addMill2();

// ===== 主角 =====
const player = new THREE.Group();
const body = box(0.8, 1.0, 0.6, mats.player); body.position.y = 0.75; player.add(body);
const head = box(0.6, 0.55, 0.55, mats.skin); head.position.y = 1.55; player.add(head);
const hat = box(0.7, 0.25, 0.65, mats.player); hat.position.y = 1.9; player.add(hat);
const legs = box(0.7, 0.3, 0.5, M(0x24486b)); legs.position.y = 0.15; player.add(legs);
const stackRoot = new THREE.Group(); stackRoot.position.set(0, 1.3, -0.55); player.add(stackRoot);
scene.add(player);
// 旋轉斧頭：木柄＋大斧刃，外圍一圈藍色刀光；斧刃顏色隨等級變化
const axe = new THREE.Group(); axe.visible = false; axe.scale.setScalar(1.6); scene.add(axe);
const axeArm = new THREE.Group(); axe.add(axeArm);
// 斧頭和刀光永遠畫在最上層，進到樹林裡也不會被樹冠擋住
const onTop = c => new THREE.MeshLambertMaterial({ color: c, depthTest: false });
function topBox(w, h, d, mat) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.renderOrder = 21; return m; }
const handle = topBox(0.16, 0.16, 1.5, onTop(0x7a4a2a)); handle.position.z = 0.75; axeArm.add(handle);
const axeHeadMat = onTop(0x5d6b7c);
const axeHead = topBox(0.9, 0.16, 0.6, axeHeadMat); axeHead.position.set(0.25, 0, 1.45); axeArm.add(axeHead);
const axeEdge = topBox(0.14, 0.18, 0.75, onTop(0xc9d4e0)); axeEdge.position.set(0.72, 0, 1.45); axeArm.add(axeEdge);
const AXE_COLORS = [0x5d6b7c, 0x1f86d6, 0xe8a800, 0xff4f1f]; // 鐵灰→藍→金→橘（深一點，在雪地上才看得清楚）
const swooshMat = new THREE.MeshBasicMaterial({ color: 0x5fc0ff, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false, depthTest: false });
const swoosh = new THREE.Mesh(new THREE.RingGeometry(0.7, 1.9, 32, 1, 0, 2.4), swooshMat);
swoosh.rotation.x = -Math.PI / 2; swoosh.renderOrder = 20;
const swooshG = new THREE.Group(); swooshG.add(swoosh); axe.add(swooshG);
let axeSpin = 0, axeShow = 0;

// 砍中時噴出的木屑
const chips = [];
const chipGeo = new THREE.BoxGeometry(0.16, 0.16, 0.16);
function burstChips(x, z, bear) {
  for (let i = 0; i < 7; i++) {
    const c = new THREE.Mesh(chipGeo, bear ? (i % 2 ? mats.meat : mats.fur) : (i % 3 ? mats.log : mats.leafSnow));
    c.position.set(x + rand(-0.3, 0.3), rand(0.6, 1.4), z + rand(-0.3, 0.3)); scene.add(c);
    chips.push({ m: c, vx: rand(-3, 3), vy: rand(3, 6), vz: rand(-3, 3), life: 0.6 });
  }
}

const carried = []; // 背上的木頭 mesh
const logGeo = new THREE.BoxGeometry(0.9, 0.22, 0.32);
function capacity() { return CFG.capacity[save.bag]; }
function restack() { carried.forEach((m, i) => { m.position.set(0, i * 0.24, 0); m.rotation.set(0, 0, 0); }); }

// ===== 飛行動畫 =====
const flies = [];
function fly(mesh, from, toFn, dur, onDone, arc = 1.5) {
  scene.add(mesh); mesh.position.copy(from);
  flies.push({ mesh, from: from.clone(), toFn, t: 0, dur, onDone, arc });
}

// ===== HUD =====
const $ = id => document.getElementById(id);
let shownCash = -1, shownWood = -1;
function hud() {
  if (shownCash !== save.cash) { $('cash').textContent = save.cash; bump('pCash'); shownCash = save.cash; }
  const nMeat = carried.filter(m => m.userData.type === 'meat').length, nLog = carried.length - nMeat;
  if (shownWood !== carried.length * 1000 + nMeat) { $('wood').textContent = nLog; $('meat').textContent = nMeat; shownWood = carried.length * 1000 + nMeat; }
  $('cap').textContent = '/' + capacity();
}
function bump(id) { const e = $(id); e.classList.remove('bump'); void e.offsetWidth; e.classList.add('bump'); }
let toastT = 0;
function toast(msg) { $('toast').textContent = msg; $('toast').style.opacity = 1; toastT = 1.6; }

// ===== 音效（用程式合成，不需要音檔；手機要先碰一下畫面才能出聲） =====
let actx = null;
function initAudio() { if (!actx) try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
addEventListener('pointerdown', initAudio); addEventListener('keydown', initAudio);
function beep(freq, dur, type, vol, slide) {
  if (!actx || save.mute) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur);
}
function muteLabel() { $('mute').textContent = save.mute ? '🔇 音效關' : '🔊 音效開'; }
$('mute').onclick = () => { save.mute = !save.mute; muteLabel(); writeSave(); };
muteLabel();
let coinCd = 0;
const sfx = {
  chop: () => beep(170, 0.09, 'square', 0.05, 0.5),
  coin: () => { if (coinCd > 0) return; coinCd = 0.05; beep(1100, 0.07, 'triangle', 0.05, 1.6); },
  unlock: () => { beep(523, 0.12, 'triangle', 0.1); setTimeout(() => beep(784, 0.2, 'triangle', 0.1), 110); try { navigator.vibrate && navigator.vibrate(60); } catch (e) {} },
};
const isTouch = matchMedia('(pointer: coarse)').matches;
let hintOn = save.cash === 0 && !save.bag && !save.axe;
$('hint').textContent = isTouch ? '按住畫面拖曳來移動\n走到樹旁邊會自動砍' : '用 WASD／方向鍵移動（也可以用滑鼠拖曳）';
$('hint').style.whiteSpace = 'pre-line';
if (!hintOn) $('hint').style.display = 'none';

// ===== 操作：浮動搖桿＋鍵盤 =====
const joy = { active: false, id: null, ox: 0, oy: 0, x: 0, y: 0 };
const joyEl = $('joy'), knob = $('knob');
addEventListener('pointerdown', e => {
  if (e.target.id === 'reset' || e.target.id === 'mute' || joy.active) return;
  joy.active = true; joy.id = e.pointerId; joy.ox = e.clientX; joy.oy = e.clientY; joy.x = joy.y = 0;
  joyEl.style.left = e.clientX + 'px'; joyEl.style.top = e.clientY + 'px'; joyEl.style.display = 'block';
  knob.style.transform = '';
});
addEventListener('pointermove', e => {
  if (!joy.active || e.pointerId !== joy.id) return;
  let dx = e.clientX - joy.ox, dy = e.clientY - joy.oy;
  const len = Math.hypot(dx, dy), R = 50;
  if (len > R) { dx *= R / len; dy *= R / len; }
  joy.x = dx / R; joy.y = dy / R;
  knob.style.transform = `translate(${dx}px,${dy}px)`;
});
function joyEnd(e) { if (e.pointerId === joy.id) { joy.active = false; joy.x = joy.y = 0; joyEl.style.display = 'none'; } }
addEventListener('pointerup', joyEnd); addEventListener('pointercancel', joyEnd);
const keys = {};
addEventListener('keydown', e => keys[e.code] = true);
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
addEventListener('contextmenu', e => e.preventDefault());

// ===== 鏡頭 =====
const camBase = new THREE.Vector3(7, 15, 11), camOffset = camBase.clone();
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); camera.aspect = w / h;
  camera.fov = 40;
  camOffset.copy(camBase).multiplyScalar(w < h ? Math.min(1.9, 1 + (h / w - 1) * 0.75) : 1); // 直式（手機）鏡頭拉遠
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
const fwd = new THREE.Vector2(-camOffset.x, -camOffset.z).normalize();
const right = new THREE.Vector2(-fwd.y, fwd.x);

// ===== 下雪 =====
const snowN = 400, snowPos = new Float32Array(snowN * 3);
for (let i = 0; i < snowN; i++) { snowPos[i * 3] = rand(-25, 25); snowPos[i * 3 + 1] = rand(0, 18); snowPos[i * 3 + 2] = rand(-25, 25); }
const snowGeo = new THREE.BufferGeometry(); snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
const snow = new THREE.Points(snowGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.15 }));
scene.add(snow);

// ===== 新手指引箭頭：前期告訴玩家下一步去哪 =====
const guide = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1, 4), new THREE.MeshBasicMaterial({ color: 0xffc400, depthTest: false }));
guide.rotation.x = Math.PI; guide.renderOrder = 22; scene.add(guide);
let guideT = 0;
function updateGuide(dt) {
  guideT += dt;
  guide.visible = save.bag + save.axe < 2; // 買過兩次升級就不再指引
  if (!guide.visible) return;
  let x, z, h = 2.2;
  const out = mills.find(m => m.out.length);
  const aff = unlocks.find(u => !u.done && u.price() - u.paid <= save.cash);
  if (out) { x = out.outPad.position.x; z = out.outPad.position.z; }
  else if (carried.length >= Math.min(capacity(), 9)) { const s = mills.find(m => m.accept === carried[carried.length - 1].userData.type); x = s.inPad.position.x; z = s.inPad.position.z; }
  else if (aff && !carried.length) { x = aff.x; z = aff.z; h = 3.2; }
  else {
    let best = 1e9;
    for (const t of trees) {
      if (!t.alive || t.locked) continue;
      const d = (t.x - player.position.x) ** 2 + (t.z - player.position.z) ** 2;
      if (d < best) { best = d; x = t.x; z = t.z; }
    }
    h = 4;
  }
  guide.position.set(x, h + Math.abs(Math.sin(guideT * 4)) * 0.6, z);
  guide.rotation.y += dt * 3;
}

// ===== 主迴圈 =====
const tmp = new THREE.Vector3();
let chopTimer = 0, dropTimer = 0, fullWarn = 0, saveTimer = 0, walk = 0;
const clock = new THREE.Clock();

function step(dt) {
  // 移動
  let ix = joy.x, iy = joy.y;
  if (keys.KeyA || keys.ArrowLeft) ix -= 1; if (keys.KeyD || keys.ArrowRight) ix += 1;
  if (keys.KeyW || keys.ArrowUp) iy -= 1; if (keys.KeyS || keys.ArrowDown) iy += 1;
  const il = Math.hypot(ix, iy); if (il > 1) { ix /= il; iy /= il; }
  const mx = right.x * ix + fwd.x * -iy, mz = right.y * ix + fwd.y * -iy;
  const moving = Math.hypot(mx, mz) > 0.05;
  if (moving) {
    if (hintOn) { hintOn = false; $('hint').style.display = 'none'; }
    let nx = player.position.x + mx * CFG.speed * dt, nz = player.position.z + mz * CFG.speed * dt;
    if (!save.east && nx > 12.2) nx = 12.2;           // 冰牆擋住
    nx = Math.max(-40, Math.min(40, nx)); nz = Math.max(-40, Math.min(40, nz));
    for (const t of trees) {                          // 不要穿過樹幹
      if (!t.alive) continue;
      const dx = nx - t.x, dz = nz - t.z, d = Math.hypot(dx, dz);
      if (d < 0.7 && d > 0) { nx = t.x + dx / d * 0.7; nz = t.z + dz / d * 0.7; }
    }
    player.position.x = nx; player.position.z = nz;
    player.rotation.y = Math.atan2(mx, mz);
    walk += dt * 12;
  }
  player.position.y = moving ? Math.abs(Math.sin(walk)) * 0.12 : 0;
  // 背上的木頭會跟著晃
  carried.forEach((m, i) => { m.position.x = Math.sin(walk * 0.5) * i * 0.012; });

  // 自動砍樹
  chopTimer -= dt;
  let target = null, best = CFG.chopRange;
  for (const t of trees) {
    if (!t.alive || t.locked) continue;
    const d = Math.hypot(t.x - player.position.x, t.z - player.position.z);
    if (d < best) { best = d; target = t; }
  }
  for (const b of bears) { // 熊優先：範圍內有熊就先打熊
    if (!b.alive) continue;
    if (Math.hypot(b.x - player.position.x, b.z - player.position.z) < CFG.chopRange + 0.4) { target = b; break; }
  }
  if (target) {
    if (carried.length >= capacity()) {
      fullWarn -= dt; if (fullWarn <= 0) { toast('背包滿了！先去卸貨'); fullWarn = 3; }
    } else {
      axeShow = 0.3;
      if (chopTimer <= 0) {
        chopTimer = CFG.chopInterval[save.axe];
        target.hp--; target.shake = 0.25; target.pop = 0.15;
        burstChips(target.x, target.z, target.isBear); sfx.chop();
        if (target.hp <= 0) {
          target.alive = false;
          if (target.isBear) target.respawn = CFG.bearRespawn; else target.regrow = CFG.treeRegrow;
          const n = target.isBear ? CFG.meatPerBear : CFG.logsPerTree;
          for (let i = 0; i < n; i++) {
            const idx = carried.length + flies.filter(f => f.toBack).length;
            if (idx >= capacity()) break;
            const m = new THREE.Mesh(logGeo, target.isBear ? mats.meat : mats.log); m.castShadow = true;
            m.userData.type = target.isBear ? 'meat' : 'log';
            const f = { toBack: true };
            fly(m, tmp.set(target.x, 1 + i * 0.3, target.z), () => stackRoot.localToWorld(new THREE.Vector3(0, idx * 0.24, 0)), 0.35 + i * 0.08, () => {
              stackRoot.add(m); carried.push(m); restack();
            });
            Object.assign(flies[flies.length - 1], f);
          }
        }
      }
    }
  }
  // 斧頭旋轉特效
  axeShow -= dt;
  axe.visible = axeShow > 0;
  if (axe.visible) {
    axeSpin += dt * (12 + save.axe * 3);
    axe.position.set(player.position.x, 1.2, player.position.z);
    axeArm.rotation.y = axeSpin;
    swooshG.rotation.y = axeSpin - Math.PI / 2 - 2.4; // 刀光拖在斧頭後面
    swooshMat.opacity = Math.min(0.55, axeShow * 3);
    axeHeadMat.color.setHex(AXE_COLORS[save.axe]);
  }
  for (let i = chips.length - 1; i >= 0; i--) {
    const c = chips[i]; c.life -= dt; c.vy -= 18 * dt;
    c.m.position.x += c.vx * dt; c.m.position.y = Math.max(0.08, c.m.position.y + c.vy * dt); c.m.position.z += c.vz * dt;
    c.m.rotation.x += dt * 10; c.m.scale.setScalar(Math.max(0.01, c.life / 0.6));
    if (c.life <= 0) { scene.remove(c.m); chips.splice(i, 1); }
  }
  // 樹的搖晃與重生
  for (const t of trees) {
    if (t.shake > 0) { t.shake -= dt; t.g.rotation.z = Math.sin(t.shake * 60) * 0.15; } else t.g.rotation.z = 0;
    if (t.pop > 0) { t.pop -= dt; if (t.alive) t.g.scale.setScalar(t.sc * (1 + Math.max(0, t.pop))); }
    if (!t.alive) {
      t.g.scale.setScalar(Math.max(0.001, t.g.scale.x - dt * 4));
      t.regrow -= dt;
      if (t.regrow <= 0) { t.alive = true; t.hp = CFG.treeHp; }
    } else if (t.g.scale.x < t.sc) t.g.scale.setScalar(Math.min(t.sc, t.g.scale.x + dt * 1.5));
  }

  // 鋸木廠：卸貨、加工、收錢
  dropTimer -= dt;
  for (const mill of mills) {
    const ip = mill.inPad.position, op = mill.outPad.position;
    const k = carried.map(m => m.userData.type).lastIndexOf(mill.accept); // 只收這個站要的東西
    if (k >= 0 && dropTimer <= 0 && Math.hypot(player.position.x - ip.x, player.position.z - ip.z) < 1.3) {
      dropTimer = 0.07;
      const m = carried.splice(k, 1)[0]; const wp = m.getWorldPosition(new THREE.Vector3());
      stackRoot.remove(m); restack();
      fly(m, wp, () => mill.g.position.clone().add(tmp.set(0, 1.6, 0)), 0.3, () => { scene.remove(m); mill.queue++; });
    }
    mill.saw.rotation.y += dt * (mill.queue ? 20 : 2);
    if (mill.queue > 0) {
      mill.timer += dt;
      if (mill.timer >= mill.time) {
        mill.timer = 0; mill.queue--;
        if (mill.customers) addCooked(mill); else spawnBill(mill, mill.g.position.clone().add(tmp.set(1.2, 1, 1)));
      }
    } else mill.timer = 0;
    mill.label.set(mill.queue ? [mill.name, '加工中 ' + mill.queue] : [mill.name]);
    if (mill.out.length && Math.hypot(player.position.x - op.x, player.position.z - op.z) < 1.4) {
      const bills = mill.out.splice(0);
      bills.forEach((b, i) => {
        const wp = b.position.clone();
        fly(b, wp, () => player.position.clone().add(tmp.set(0, 2.2, 0)), 0.25 + i * 0.02, () => {
          scene.remove(b); save.cash += mill.value; sfx.coin();
        }, 1);
      });
    }
  }

  // 付款格
  for (const u of unlocks) {
    if (u.done) continue;
    const p = u.price();
    const on = Math.hypot(player.position.x - u.x, player.position.z - u.z) < 1.2;
    if (on && save.cash > 0 && u.paid < p) {
      u.payAcc += dt * p / CFG.payRate;
      const pay = Math.min(Math.floor(u.payAcc), save.cash, p - u.paid);
      if (pay > 0) {
        u.payAcc -= pay; save.cash -= pay; u.paid += pay;
        const b = box(0.5, 0.1, 0.3, mats.cash);
        fly(b, player.position.clone().add(tmp.set(0, 2, 0)), () => new THREE.Vector3(u.x, 0.1, u.z), 0.25, () => scene.remove(b), 1);
      }
      if (u.paid >= p) { u.paid = 0; u.payAcc = 0; u.buy(); sfx.unlock(); writeSave(); }
      u.refresh();
    } else u.payAcc = 0;
  }

  coinCd -= dt;
  updateGuide(dt);
  updateBears(dt);
  updateVillagers(dt);
  // 飛行動畫
  for (let i = flies.length - 1; i >= 0; i--) {
    const f = flies[i]; f.t += dt;
    const k = Math.min(1, f.t / f.dur), to = f.toFn();
    f.mesh.position.lerpVectors(f.from, to, k);
    f.mesh.position.y += Math.sin(k * Math.PI) * f.arc;
    f.mesh.rotation.y += dt * 8;
    if (k >= 1) { flies.splice(i, 1); f.onDone && f.onDone(); }
  }

  // 下雪
  for (let i = 0; i < snowN; i++) {
    snowPos[i * 3 + 1] -= dt * 1.5;
    if (snowPos[i * 3 + 1] < 0) {
      snowPos[i * 3 + 1] = 18;
      snowPos[i * 3] = player.position.x + rand(-25, 25); snowPos[i * 3 + 2] = player.position.z + rand(-25, 25);
    }
  }
  snowGeo.attributes.position.needsUpdate = true;

  // 鏡頭跟隨
  camera.position.lerp(tmp.copy(player.position).add(camOffset), 1 - Math.exp(-dt * 6));
  camera.lookAt(player.position.x, 0.8, player.position.z);
  sun.position.set(player.position.x - 10, 20, player.position.z + 8);
  sun.target.position.copy(player.position);

  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').style.opacity = 0; }
  saveTimer += dt; if (saveTimer > 2) { saveTimer = 0; writeSave(); }
  hud();
}

camera.position.copy(player.position).add(camOffset);
function loop() {
  requestAnimationFrame(loop);
  step(Math.min(clock.getDelta(), 0.05));
  renderer.render(scene, camera);
}
loop();
addEventListener('visibilitychange', () => { if (document.hidden) writeSave(); });
window.__game = { save, player, carried, mills, unlocks, trees, bears, step, render: () => renderer.render(scene, camera) }; // 測試用
</script>
</body>
</html>
